<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <rect width="900" height="650" fill="#ffffff"/>
  <style>
    text { font-family: Arial, sans-serif; font-size: 20px; fill: #222; }
    .small { font-size: 16px; }
    .axis { stroke: #333; stroke-width: 2; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .old { fill: rgba(148, 0, 211, 0.10); stroke: #9400d3; stroke-width: 4; }
    .new { fill: rgba(0, 120, 180, 0.16); stroke: #0078b4; stroke-width: 5; }
  </style>

  <text x="40" y="42" font-size="28">XLeRobot Place Effective Sampling Range</text>
  <text x="40" y="74" class="small">World/table coordinates. Robot base is at (0.05, 0.00).</text>

  <g transform="translate(110,560)">
    <line x1="0" y1="0" x2="700" y2="0" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="-470" class="axis"/>

    <g>
      <line x1="0" y1="-470" x2="700" y2="-470" class="grid"/>
      <line x1="0" y1="-391.7" x2="700" y2="-391.7" class="grid"/>
      <line x1="0" y1="-313.3" x2="700" y2="-313.3" class="grid"/>
      <line x1="0" y1="-235" x2="700" y2="-235" class="grid"/>
      <line x1="0" y1="-156.7" x2="700" y2="-156.7" class="grid"/>
      <line x1="0" y1="-78.3" x2="700" y2="-78.3" class="grid"/>
      <line x1="0" y1="0" x2="700" y2="0" class="grid"/>

      <line x1="0" y1="0" x2="0" y2="-470" class="grid"/>
      <line x1="140" y1="0" x2="140" y2="-470" class="grid"/>
      <line x1="280" y1="0" x2="280" y2="-470" class="grid"/>
      <line x1="420" y1="0" x2="420" y2="-470" class="grid"/>
      <line x1="560" y1="0" x2="560" y2="-470" class="grid"/>
      <line x1="700" y1="0" x2="700" y2="-470" class="grid"/>
    </g>

    <text x="-10" y="35" class="small">0.12</text>
    <text x="130" y="35" class="small">0.20</text>
    <text x="270" y="35" class="small">0.28</text>
    <text x="410" y="35" class="small">0.36</text>
    <text x="550" y="35" class="small">0.44</text>
    <text x="300" y="75">x (m)</text>

    <text x="-62" y="6" class="small">-0.15</text>
    <text x="-62" y="-72" class="small">-0.10</text>
    <text x="-55" y="-151" class="small">-0.05</text>
    <text x="-48" y="-229" class="small">0.00</text>
    <text x="-48" y="-307" class="small">0.05</text>
    <text x="-48" y="-386" class="small">0.10</text>
    <text x="-48" y="-464" class="small">0.15</text>
    <text x="-90" y="-250" transform="rotate(-90 -90 -250)">y (m)</text>

    <!-- scale: x 1750 px/m from 0.12, y 1566.67 px/m from -0.15 -->
    <!-- v32 x [0.19,0.34], y [-0.05,0.05] -->
    <rect x="122.5" y="-313.3" width="262.5" height="156.6" class="old"/>
    <!-- v33 x [0.27,0.40], y [0.05,0.15] -->
    <rect x="262.5" y="-470" width="227.5" height="156.7" class="new"/>

    <circle cx="-122.5" cy="-235" r="8" fill="#111"/>
    <text x="-145" y="-300" class="small">robot base</text>

    <circle cx="253.75" cy="-235" r="7" fill="#9400d3"/>
    <text x="287" y="-214" class="small" fill="#9400d3">v32 center (0.265, 0.00)</text>

    <circle cx="376.25" cy="-391.7" r="7" fill="#0078b4"/>
    <text x="410" y="-356" class="small" fill="#0078b4">v33 center (0.335, 0.10)</text>
  </g>

  <rect x="610" y="105" width="32" height="20" class="old"/>
  <text x="655" y="122" class="small">v32: x [0.19, 0.34], y [-0.05, 0.05]</text>
  <rect x="610" y="140" width="32" height="20" class="new"/>
  <text x="655" y="157" class="small">v33: x [0.27, 0.40], y [0.05, 0.15]</text>
  <text x="610" y="192" class="small">v33 chosen from current top-camera projection</text>
  <text x="610" y="218" class="small">largest bin/cube corners remain inside image</text>
  <text x="610" y="244" class="small">item-bin minimum center distance: 0.12 m</text>

  <text x="40" y="620" class="small">env params: spawn_box_pos=[0.285, 0.10], spawn_box_half_size=[0.065, 0.05], item_bin_min_center_dist=0.12</text>
</svg>
